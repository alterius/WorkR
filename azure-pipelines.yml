trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  major: 0
  minor: 0

name: $(major).$(minor).$(Rev:r)

stages:
  - stage: build
    displayName: Build v$(Build.BuildNumber)
    jobs:
      - job: build
        displayName: Build
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Setup .NET 8
            inputs:
              version: 8.x

          - task: UseDotNet@2
            displayName: Setup .NET 9
            inputs:
              version: 9.x

          - task: UseDotNet@2
            displayName: Setup .NET 10
            inputs:
              version: 10.x

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: WorkR.slnx

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: WorkR.slnx
              arguments: --no-restore --configuration Release /p:Version=$(Build.BuildNumber)

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: WorkR.slnx
              arguments: --no-build --configuration Release --collect "Code coverage"

          - task: DotNetCoreCLI@2
            displayName: Pack (preview)
            inputs:
              command: pack
              packagesToPack: WorkR.slnx
              nobuild: true
              configuration: Release
              versioningScheme: byEnvVar
              versionEnvVar: BUILD_VERSION_PREVIEW
            env:
              BUILD_VERSION_PREVIEW: $(Build.BuildNumber)-preview

          - task: DotNetCoreCLI@2
            displayName: Pack (release)
            inputs:
              command: pack
              packagesToPack: WorkR.slnx
              nobuild: true
              configuration: Release
              versioningScheme: byEnvVar
              versionEnvVar: BUILD_VERSION_RELEASE
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
            env:
              BUILD_VERSION_RELEASE: $(Build.BuildNumber)

          - task: PublishBuildArtifacts@1
            displayName: Publish artifacts
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: nuget-packages

  - stage: publish_preview
    displayName: Publish Preview v$(Build.BuildNumber)-preview
    dependsOn: build
    condition: succeeded('build')
    jobs:
      - deployment: publish_preview
        displayName: Publish Preview
        environment: nuget-preview
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: nuget-packages

                - task: DotNetCoreCLI@2
                  displayName: Push to NuGet.org
                  inputs:
                    command: push
                    packagesToPush: $(Pipeline.Workspace)/nuget-packages/*-preview.nupkg
                    nuGetFeedType: external
                    publishFeedCredentials: NuGet.org

  - stage: publish_release
    displayName: Publish Release v$(Build.BuildNumber)
    dependsOn: build
    condition: and(succeeded('build'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: publish_release
        displayName: Publish Release
        environment: nuget-release
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: nuget-packages

                - task: DotNetCoreCLI@2
                  displayName: Push to NuGet.org
                  inputs:
                    command: push
                    packagesToPush: $(Pipeline.Workspace)/nuget-packages/!(*.symbols).nupkg
                    nuGetFeedType: external
                    publishFeedCredentials: NuGet.org
