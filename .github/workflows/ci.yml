name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore WorkR.slnx

      - name: Build
        run: dotnet build WorkR.slnx --no-restore --configuration Release

      - name: Report version
        run: echo "## v${NBGV_NuGetPackageVersion}" >> $GITHUB_STEP_SUMMARY

      - name: Test
        run: dotnet test WorkR.slnx --no-build --configuration Release --logger trx --results-directory ./test-results

      - name: Pack
        run: dotnet pack WorkR.slnx --no-build --configuration Release --output ./artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
