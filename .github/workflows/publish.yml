name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: CI run ID to publish from
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish (run {0})', inputs.run-id) || format('Publish ({0})', github.event.workflow_run.head_branch) }}

permissions:
  actions: read

jobs:
  inspect:
    name: Inspect packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      build-run-id: ${{ steps.ctx.outputs.run-id }}
    steps:
      - name: Resolve context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-id=${{ inputs.run-id }}" >> $GITHUB_OUTPUT
          else
            echo "run-id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          run-id: ${{ steps.ctx.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifacts

      - name: Summarise
        run: |
          echo "## Packages pending approval" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Run | \`${{ steps.ctx.outputs.run-id }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.ctx.outputs.branch }}" ]; then
            echo "| Branch | \`${{ steps.ctx.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | \`${{ steps.ctx.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          for f in ./artifacts/*.nupkg; do echo "- \`$(basename $f)\`" >> $GITHUB_STEP_SUMMARY; done

  publish:
    name: Push to NuGet
    needs: inspect
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          run-id: ${{ needs.inspect.outputs.build-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
